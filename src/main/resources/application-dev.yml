gatewell:
  auth:
    enabled: false
  admin:
    secret: local-dev-example-only  # example value for local dev; never used in prod (see application-cloudrun.yml)

spring:
  datasource:
    url: jdbc:h2:mem:gatewell
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
