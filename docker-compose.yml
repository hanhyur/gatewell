services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatewell
      POSTGRES_USER: gatewell
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gatewell_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatewell"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/gatewell
      DATABASE_USERNAME: gatewell
      DATABASE_PASSWORD: ${DB_PASSWORD:-gatewell_secret}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
