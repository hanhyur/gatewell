services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gatewell
      POSTGRES_USER: gatewell
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatewell"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://db:5432/gatewell
      DATABASE_USERNAME: gatewell
      DATABASE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD env var is required}
      GATEWELL_CORS_ALLOWED_ORIGINS: http://localhost:3001
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8081
    depends_on:
      - app

volumes:
  pgdata:
